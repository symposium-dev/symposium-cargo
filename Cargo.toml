[package]
name = "symposium-cargo"
version = "0.2.0"
edition = "2024"
license = "MIT or Apache-2.0"
description = "Symposium Cargo proxy - an MCP server connecting to Cargo and a ACP Proxy managing it"
repository = "https://github.com/symposium-dev/symposium-cargo"
readme = "README.md"


[dependencies]
anyhow = "1.0.100"
indoc = "2.0.7"
pico-args = "0.5.0"
sacp = "11.0.0"
sacp-tokio = "11.0.0"
schemars = "1.1.0"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "process"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
elizacp = "12.0.0"
yopo = "11.0.0"
sacp-conductor = "11.0.0"
tempfile = "3.6"
